<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كُتبي - منصة الطلاب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-indigo-600 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">📚 كُتبي</h1>
            <div class="space-x-4 space-x-reverse">
                <a href="index.html" class="hover:underline">الرئيسية</a>
                <a href="add-book.html" class="bg-white text-indigo-600 px-4 py-2 rounded-full font-bold shadow">أنشر كتابك</a>
                <a href="auth.html" id="auth-btn" class="hover:underline">دخول</a>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-6">
        <div class="mb-8 text-center">
            <h2 class="text-3xl font-bold text-gray-800">ابحث عن كتابك القادم</h2>
            <input type="text" id="search" placeholder="اسم المادة أو الكتاب..." class="mt-4 w-full max-w-md p-3 rounded-lg border shadow-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div id="books-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </div>

    <div id="chat-box" class="fixed bottom-4 left-4 w-80 bg-white shadow-2xl rounded-t-xl hidden flex flex-col border border-indigo-100">
        <div class="bg-indigo-600 text-white p-3 rounded-t-xl flex justify-between">
            <span id="chat-with">المحادثة</span>
            <button onclick="toggleChat()">✖</button>
        </div>
        <div id="messages" class="h-64 overflow-y-auto p-3 space-y-2 text-sm bg-gray-50"></div>
        <div class="p-2 border-t flex">
            <input type="text" id="msg-input" placeholder="اكتب رسالتك.." class="flex-1 p-2 outline-none">
            <button onclick="sendMessage()" class="bg-indigo-600 text-white px-3 py-1 rounded">إرسال</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>window.onload = displayBooks;</script>
</body>
</html>
