<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كُتبي - منصة تبادل الكتب الجامعية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* إضافة لمسة جمالية للخطوط العربية */
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-indigo-700 text-white p-4 shadow-xl sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-2xl">📚</span>
                <h1 class="text-2xl font-bold tracking-tight">كُتبي الجامعي</h1>
            </div>
            <div class="flex items-center gap-6">
                <a href="index.html" class="hover:text-indigo-200 transition">الرئيسية</a>
                <button id="auth-nav-btn" onclick="window.location.href='auth.html'" class="bg-indigo-800 px-4 py-2 rounded-lg hover:bg-indigo-900 transition">دخول</button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-6 text-center">
        
        <div id="user-actions" class="py-12 bg-white rounded-3xl shadow-sm border border-gray-100 mb-10 transition-all">
            <div class="animate-pulse flex flex-col items-center">
                <div class="h-4 bg-gray-200 rounded w-48 mb-4"></div>
                <div class="h-10 bg-gray-200 rounded w-64"></div>
            </div>
            <p class="text-gray-500 mt-4">جاري التحقق من حالة الحساب...</p>
        </div>

        <div class="flex items-center my-10">
            <div class="flex-grow h-px bg-gray-200"></div>
            <span class="px-4 text-gray-400 font-bold text-sm">آخر الكتب والدوسيات المعروضة</span>
            <div class="flex-grow h-px bg-gray-200"></div>
        </div>

        <div id="books-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </div>

    <div id="chat-box" class="fixed bottom-0 left-6 w-80 bg-white shadow-2xl rounded-t-2xl hidden flex flex-col border border-indigo-100 z-50">
        <div class="bg-indigo-600 text-white p-4 rounded-t-2xl flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 bg-green-400 rounded-full"></div>
                <span id="chat-with" class="font-bold text-sm text-truncate">المحادثة</span>
            </div>
            <button onclick="toggleChat()" class="text-white hover:text-gray-200">✕</button>
        </div>
        <div id="messages" class="h-80 overflow-y-auto p-4 space-y-3 bg-gray-50 flex flex-col">
            <p class="text-center text-xs text-gray-400 mt-10">ابدأ المحادثة الآن بخصوص الكتاب</p>
        </div>
        <div class="p-3 border-t bg-white flex items-center gap-2">
            <input type="text" id="msg-input" placeholder="اكتب رسالتك هنا..." class="flex-1 p-2 bg-gray-100 rounded-lg outline-none text-sm focus:ring-2 focus:ring-indigo-500">
            <button onclick="sendMessage()" class="bg-indigo-600 text-white p-2 rounded-lg hover:bg-indigo-700 transition">
                🚀
            </button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // تشغيل الوظائف عند فتح الصفحة
        window.onload = function() {
            displayBooks();
        };
    </script>
</body>
</html>
