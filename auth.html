<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - كُتبي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h2 id="auth-title" class="text-2xl font-bold text-center mb-6">تسجيل الدخول</h2>
        
        <input type="email" id="email" placeholder="البريد الإلكتروني" class="w-full p-3 border rounded mb-4">
        <input type="password" id="password" placeholder="كلمة المرور" class="w-full p-3 border rounded mb-4">
        
        <button onclick="handleAuth()" id="auth-btn" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold hover:bg-indigo-700">دخول</button>
        
        <p class="text-center mt-4 text-sm text-gray-600">
            ليس لديك حساب؟ <a href="#" onclick="toggleAuth()" id="toggle-link" class="text-indigo-600 font-bold">إنشاء حساب جديد</a>
        </p>
        <div class="text-center mt-4">
            <a href="index.html" class="text-gray-500 text-xs">العودة للرئيسية</a>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        let isSignUp = false;
        function toggleAuth() {
            isSignUp = !isSignUp;
            document.getElementById('auth-title').innerText = isSignUp ? "إنشاء حساب جديد" : "تسجيل الدخول";
            document.getElementById('auth-btn').innerText = isSignUp ? "تسجيل" : "دخول";
            document.getElementById('toggle-link').innerText = isSignUp ? "تسجيل الدخول" : "إنشاء حساب جديد";
        }

        async function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (isSignUp) {
                const { error } = await _supabase.auth.signUp({ email, password });
                if (error) alert(error.message); else alert("تفقد بريدك الإلكتروني لتأكيد الحساب!");
            } else {
                const { error } = await _supabase.auth.signInWithPassword({ email, password });
                if (error) alert(error.message); else window.location.href = "index.html";
            }
        }
    </script>
</body>
</html>
