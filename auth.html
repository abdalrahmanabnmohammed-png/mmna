<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الانضمام إلى كُتبي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border border-gray-100">
        <h2 id="auth-title" class="text-3xl font-black text-center mb-8 text-indigo-900">تسجيل الدخول</h2>
        
        <div id="name-field" class="hidden">
            <label class="block text-sm font-bold text-gray-700 mb-2">الاسم الكامل</label>
            <input type="text" id="full_name" placeholder="مثال: أحمد محمد" class="w-full p-4 border border-gray-200 rounded-2xl mb-4 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <label class="block text-sm font-bold text-gray-700 mb-2">البريد الإلكتروني الجامعي</label>
        <input type="email" id="email" placeholder="email@example.com" class="w-full p-4 border border-gray-200 rounded-2xl mb-4 focus:ring-2 focus:ring-indigo-500 outline-none">
        
        <label class="block text-sm font-bold text-gray-700 mb-2">كلمة المرور</label>
        <input type="password" id="password" placeholder="••••••••" class="w-full p-4 border border-gray-200 rounded-2xl mb-6 focus:ring-2 focus:ring-indigo-500 outline-none">
        
        <button onclick="handleAuth()" id="auth-btn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-lg hover:bg-indigo-700 transition-all">دخول</button>
        
        <p class="text-center mt-6 text-gray-500">
            <span id="toggle-text">ليس لديك حساب؟</span> 
            <a href="#" onclick="toggleAuth()" id="toggle-link" class="text-indigo-600 font-bold underline">إنشاء حساب جديد</a>
        </p>
    </div>

    <script src="app.js"></script>
    <script>
        let isSignUp = false;
        function toggleAuth() {
            isSignUp = !isSignUp;
            document.getElementById('auth-title').innerText = isSignUp ? "حساب جديد" : "تسجيل الدخول";
            document.getElementById('auth-btn').innerText = isSignUp ? "إنشاء الحساب" : "دخول";
            document.getElementById('name-field').classList.toggle('hidden');
            document.getElementById('toggle-text').innerText = isSignUp ? "لديك حساب بالفعل؟" : "ليس لديك حساب؟";
            document.getElementById('toggle-link').innerText = isSignUp ? "سجل دخولك" : "إنشاء حساب جديد";
        }

        async function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const fullName = document.getElementById('full_name').value;
            
            if (isSignUp) {
                if(!fullName) { alert("يرجى إدخال اسمك"); return; }
                const { data, error } = await _supabase.auth.signUp({ 
                    email, 
                    password,
                    options: { data: { full_name: fullName } } 
                });
                if (error) alert("خطأ: " + error.message);
                else {
                    // تخزين الاسم في جدول البروفايل فوراً
                    await _supabase.from('profiles').insert([{ id: data.user.id, username: fullName, full_name: fullName }]);
                    alert("تم التسجيل! تفقد إيميلك للتفعيل.");
                }
            } else {
                const { error } = await _supabase.auth.signInWithPassword({ email, password });
                if (error) alert("بيانات الدخول غير صحيحة");
                else window.location.href = "index.html";
            }
        }
    </script>
</body>
</html>
