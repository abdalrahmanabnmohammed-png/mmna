<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انشر كتابك | كُتبي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Tajawal', sans-serif; }</style>
</head>
<body class="bg-indigo-50 min-h-screen flex flex-col">

    <nav class="bg-white shadow-sm p-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="text-indigo-600 font-bold flex items-center gap-2">
                <span>←</span> العودة للرئيسية
            </a>
            <h1 class="text-xl font-black text-gray-800">إضافة معروض جديد</h1>
        </div>
    </nav>

    <div class="container mx-auto max-w-2xl p-6 mt-10">
        <div class="bg-white rounded-3xl shadow-xl p-8 border border-gray-100">
            <form id="addBookForm" class="space-y-5 text-right">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">اسم الكتاب أو الدوسية</label>
                    <input type="text" id="title" required placeholder="مثلاً: كالكولاس 1 - دوسية مراجعة" class="w-full p-4 bg-gray-50 border-0 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">التصنيف</label>
                        <select id="category" class="w-full p-4 bg-gray-50 border-0 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none font-bold text-gray-600">
                            <option value="هندسة">هندسة</option>
                            <option value="طب">علوم طبية</option>
                            <option value="آداب">آداب ولغات</option>
                            <option value="دوسية">دوسية / ملخص</option>
                            <option value="أخرى">تخصصات أخرى</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">نوع العرض</label>
                        <select id="type" onchange="togglePrice()" class="w-full p-4 bg-gray-50 border-0 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none font-bold text-gray-600">
                            <option value="بيع">بيع كاش</option>
                            <option value="تبديل">تبديل بكتاب آخر</option>
                        </select>
                    </div>
                </div>

                <div id="price-container">
                    <label class="block text-sm font-bold text-gray-700 mb-2">السعر (بالدينار)</label>
                    <input type="number" id="price" placeholder="0.00" class="w-full p-4 bg-gray-50 border-0 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">وصف قصير (حالة الكتاب)</label>
                    <textarea id="description" rows="3" placeholder="مثلاً: الكتاب نظيف جداً، لا توجد عليه ملاحظات..." class="w-full p-4 bg-gray-50 border-0 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                </div>

                <button type="submit" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black text-lg shadow-lg hover:bg-indigo-700 transition-all transform hover:scale-[1.02]">
                    انشر الإعلان الآن 🚀
                </button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        function togglePrice() {
            const type = document.getElementById('type').value;
            const priceContainer = document.getElementById('price-container');
            priceContainer.style.display = (type === 'تبديل') ? 'none' : 'block';
        }
        document.getElementById('addBookForm').onsubmit = addBook;
    </script>
</body>
</html>
